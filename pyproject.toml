[project]
name = "blackforge"
version = "0.1.0"
description = "Autonomous bug discovery, repair, and verification — deterministic core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
blackforge = "blackforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
